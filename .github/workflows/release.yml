# Publishes a GitHub release whenever a version tag is pushed:
#
#   git tag v1.2.0
#   git push origin v1.2.0
#
# The build is self-contained, so the zip runs on a machine without the .NET
# runtime installed. It still needs the WebView2 runtime, which ships with
# Windows 10/11.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          dotnet publish ClaudeUsageWidget.csproj -c Release -r win-x64 --self-contained `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true -p:DebugType=none `
            -p:Version=$version -o publish
          Remove-Item publish/*.xml
          Copy-Item README.md, LICENSE publish/
          Compress-Archive publish/* "ClaudeUsageWidget-${{ github.ref_name }}-win-x64.zip"

      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}"
          "ClaudeUsageWidget-${{ github.ref_name }}-win-x64.zip"
          --title "${{ github.ref_name }}" --generate-notes
